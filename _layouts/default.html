<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap bar">
      <a class="wordmark" href="{{ '/' | relative_url }}">spottr</a>
      <nav>
        <a href="{{ '/support' | relative_url }}">Support</a>
        <a href="{{ '/privacy-policy' | relative_url }}">Privacy</a>
        <a href="{{ '/terms-of-service' | relative_url }}">Terms</a>
      </nav>
    </div>
  </header>

  <main class="wrap {% if page.landing %}landing{% else %}prose{% endif %}">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>spottr is for adults 18+ · <a href="mailto:support@spottr-io.com">support@spottr-io.com</a></p>
      <p class="links">
        <a href="{{ '/support' | relative_url }}">Support</a>
        <a href="{{ '/privacy-policy' | relative_url }}">Privacy Policy</a>
        <a href="{{ '/terms-of-service' | relative_url }}">Terms of Service</a>
        <a href="{{ '/community-guidelines' | relative_url }}">Community Guidelines</a>
        <a href="{{ '/delete-account' | relative_url }}">Delete your account</a>
      </p>
      <p class="muted">© {{ site.time | date: '%Y' }} spottr</p>
    </div>
  </footer>
</body>
</html>
